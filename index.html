<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/images/branding/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pup O'Clock delivers monthly subscription boxes packed with treats, toys, and surprises for your pup — plus official Pup O'Clock swag."
    />
    <title>Pup O'Clock — Monthly Subscription Boxes for Your Pup</title>
  </head>
  <body>
    <!-- Static registration of the contact form so Netlify detects it at
         deploy time; the real form is rendered by React (src/pages/Contact.jsx). -->
    <form name="contact" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="message"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
